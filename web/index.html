<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Faceless YouTube OS — Documentary Studio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Faceless YouTube OS home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">FACELESS YOUTUBE OS<span>DOCUMENTARY STUDIO</span></span>
      </a>
      <nav class="topnav" aria-label="Primary">

      <div class="topbar-right"><span class="signal-label"><i class="signal-dot"></i> HUMAN-CONTROLLED · NEVER UPLOADS OR PUBLISHES</span><form method="post" action="/auth/logout" style="margin:0"><button class="btn btn-small" type="submit">Sign out</button></form></div>

      <div class="skeleton" style="height:36px;width:220px;margin-bottom:24px"></div>
